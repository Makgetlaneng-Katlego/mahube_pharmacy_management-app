name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      # TODO: Replace these placeholders with your real file names / paths.
      Solution_Name: "Mahube_pharmacy management app.slnx"
      # If you don't have a separate test project, delete Test_Project_Path
      # and the "Execute test project" step below.
      Test_Project_Path: ""   # e.g. "Mahube.Tests/Mahube.Tests.csproj"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install the .NET SDK(s) required by the solution.
      # Only the major version is needed; patch is resolved by the action.
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Add MSBuild to the PATH so we can call it directly.
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      # Restore NuGet dependencies.
      - name: Restore the application
        run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
        env:
          Configuration: ${{ matrix.configuration }}

      # Build the solution in the current configuration.
      - name: Build the application
        run: msbuild $env:Solution_Name /p:Configuration=$env:Configuration
        env:
          Configuration: ${{ matrix.configuration }}

      # Run the unit tests, if a test project is configured.
      - name: Execute test project
        if: env.Test_Project_Path != ''
        run: dotnet test $env:Test_Project_Path --configuration $env:Configuration --no-build
        env:
          Configuration: ${{ matrix.configuration }}

      # Upload the built output as a downloadable artifact.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MahubePharmacy-${{ matrix.configuration }}
          path: |
            **/bin/${{ matrix.configuration }}/
            !**/obj/**
          if-no-files-found: warn

